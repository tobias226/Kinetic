<svg xmlns="http://www.w3.org/2000/svg" width="620" height="465" viewBox="0 0 620 465" role="img" aria-label="Kinetic relationship network linking ideas, capital, people and long-term value">
<defs><radialGradient id="halo"><stop offset="0" stop-color="#66bd8b" stop-opacity=".26"/><stop offset="1" stop-color="#66bd8b" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-400%" y="-400%" width="900%" height="900%"><feGaussianBlur stdDeviation="3.5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="edge"><stop stop-color="#669c83"/><stop offset="1" stop-color="#caeed1"/></linearGradient></defs>
<style>
#background{fill:#0e211d;} .frame{fill:none;stroke:#315844;stroke-width:1.4;} .orbit{fill:none;stroke:#6ab88c;stroke-opacity:.12;stroke-width:1.3;stroke-dasharray:4 9;}
.edges line{stroke:url(#edge);stroke-opacity:.45;stroke-width:1.5;stroke-dasharray:3 7;animation:move 12s linear infinite;}
.node{fill:#aee5bd;stroke:#16412a;stroke-width:3;filter:url(#glow);animation:breathe 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
.centre{fill:#e5ffec;stroke:#326e49;stroke-width:6;filter:url(#glow);animation:breathe 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
.label{font:600 12px Arial,sans-serif;fill:#b8d9c2;letter-spacing:1.1px;}
.core-text{font:800 13px Arial,sans-serif;fill:#ecfff0;letter-spacing:2.6px;}
@keyframes move {to{stroke-dashoffset:-130;}} @keyframes breathe{0%,100%{opacity:.8;transform:scale(.95);}50%{opacity:1;transform:scale(1.09);}}
@media(prefers-reduced-motion:reduce){.edges line,.node,.centre{animation:none!important;}.moving{display:none!important;}}
</style>
<rect x="1" y="1" width="618" height="463" rx="24" id="background"/><rect x="1" y="1" width="618" height="463" rx="24" class="frame"/>
