<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="Kinetic graphic showing an animated network of opportunities, people, capital and value with wind turbines integrated into a real assets landscape">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1917"/>
      <stop offset="0.45" stop-color="#102622"/>
      <stop offset="1" stop-color="#081211"/>
    </linearGradient>
    <radialGradient id="haloMain" cx="50%" cy="45%" r="52%">
      <stop offset="0" stop-color="#78dfa1" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#4cb77c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4cb77c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloSide" cx="30%" cy="25%" r="45%">
      <stop offset="0" stop-color="#cbf8d6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#cbf8d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9d72"/>
      <stop offset="0.5" stop-color="#7bde9d"/>
      <stop offset="1" stop-color="#d5ffe1"/>
    </linearGradient>
    <linearGradient id="turbineStem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7fff0"/>
      <stop offset="1" stop-color="#90bca1"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fff9"/>
      <stop offset="1" stop-color="#95c3a6"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="frameClip"><rect x="2" y="2" width="756" height="516" rx="28"/></clipPath>
  </defs>
  <style>
    .frame{fill:none;stroke:#335b49;stroke-width:1.4}
    .orbit{fill:none;stroke:#8ae3aa;stroke-opacity:.12;stroke-width:1.2;stroke-dasharray:4 10}
    .network line{stroke:url(#edge);stroke-opacity:.48;stroke-width:1.6;stroke-dasharray:4 8;animation:dash 11s linear infinite}
    .pulse{fill:#e4ffee;filter:url(#glow)}
    .node{fill:#9ce5b5;stroke:#123927;stroke-width:3;filter:url(#glow);animation:breathe 4.1s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    .node.core{fill:#f0fff5;stroke:#2f8052;stroke-width:5;animation:breathe 3.2s ease-in-out infinite}
    .node.small{fill:#73b18c}
    .core-ring{fill:none;stroke:#7dd69b;stroke-opacity:.55;stroke-width:1.2;stroke-dasharray:3 10;animation:spin 18s linear infinite;transform-origin:300px 232px}
    .label{font:600 12px Arial,sans-serif;fill:#d1ead8;letter-spacing:1px}
    .micro{font:700 11px Arial,sans-serif;fill:#b9d8c3;letter-spacing:1.2px}
    .core-text{font:800 14px Arial,sans-serif;fill:#effff3;letter-spacing:3px}
    .turbine-tower{fill:url(#turbineStem);opacity:.96}
    .turbine-hub{fill:#f1fff6;filter:url(#glow)}
    .blade{fill:url(#blade);filter:url(#glow)}
    .turbine-glow{fill:url(#haloSide);opacity:.95}
    .horizon{fill:url(#bg);opacity:.55}
    .caption{font:700 11px Arial,sans-serif;fill:#bde2c8;letter-spacing:2.1px}
    .caption strong{fill:#e7fff1}
    .aurora{mix-blend-mode:screen;opacity:.65}
    @keyframes dash{to{stroke-dashoffset:-120}}
    @keyframes breathe{0%,100%{opacity:.82;transform:scale(.95)}50%{opacity:1;transform:scale(1.12)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes rotor{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.network line,.node,.core-ring,.rotor{animation:none!important}.moving{display:none!important}}
  </style>

  <g clip-path="url(#frameClip)">
    <rect x="2" y="2" width="756" height="516" rx="28" fill="url(#bg)"/>
    <rect x="2" y="2" width="756" height="516" rx="28" class="frame"/>

    <ellipse cx="285" cy="230" rx="240" ry="190" fill="url(#haloMain)"/>
    <ellipse cx="598" cy="126" rx="132" ry="104" class="aurora" fill="url(#haloSide)" filter="url(#softGlow)"/>
    <ellipse cx="612" cy="340" rx="140" ry="88" class="aurora" fill="url(#haloSide)" filter="url(#softGlow)"/>
    <path d="M0 470 C120 440 180 445 265 455 C360 467 430 450 500 430 C604 401 689 404 760 423 L760 520 L0 520 Z" fill="#0f231f" opacity=".94"/>
    <path d="M0 452 C142 428 240 436 330 445 C430 456 533 433 640 407 C688 396 724 398 760 406 L760 520 L0 520 Z" fill="#112a24" opacity=".76"/>

    <g class="orbit"><circle cx="300" cy="232" r="126"/><circle cx="300" cy="232" r="176"/></g>
    <circle cx="300" cy="232" r="156" fill="none" class="core-ring"/>

    <g class="network">
      <line x1="300" y1="232" x2="112" y2="102"/>
      <line x1="300" y1="232" x2="452" y2="92"/>
      <line x1="300" y1="232" x2="526" y2="220"/>
      <line x1="300" y1="232" x2="414" y2="372"/>
      <line x1="300" y1="232" x2="142" y2="344"/>
      <line x1="112" y1="102" x2="70" y2="56"/>
      <line x1="112" y1="102" x2="212" y2="62"/>
      <line x1="112" y1="102" x2="184" y2="174"/>
      <line x1="112" y1="102" x2="64" y2="222"/>
      <line x1="112" y1="102" x2="452" y2="92"/>
      <line x1="452" y1="92" x2="348" y2="56"/>
      <line x1="452" y1="92" x2="560" y2="136"/>
      <line x1="452" y1="92" x2="392" y2="182"/>
      <line x1="452" y1="92" x2="526" y2="220"/>
      <line x1="526" y1="220" x2="580" y2="332"/>
      <line x1="526" y1="220" x2="414" y2="372"/>
      <line x1="526" y1="220" x2="392" y2="182"/>
      <line x1="414" y1="372" x2="566" y2="352"/>
      <line x1="414" y1="372" x2="278" y2="408"/>
      <line x1="414" y1="372" x2="364" y2="310"/>
      <line x1="414" y1="372" x2="142" y2="344"/>
      <line x1="142" y1="344" x2="278" y2="408"/>
      <line x1="142" y1="344" x2="58" y2="366"/>
      <line x1="142" y1="344" x2="64" y2="222"/>
      <line x1="142" y1="344" x2="212" y2="278"/>
      <line x1="348" y1="56" x2="392" y2="182"/>
      <line x1="184" y1="174" x2="212" y2="278"/>
      <line x1="184" y1="174" x2="300" y2="232"/>
      <line x1="212" y1="278" x2="364" y2="310"/>
      <line x1="392" y1="182" x2="364" y2="310"/>
    </g>

    <g class="moving">
      <circle r="3.6" class="pulse"><animateMotion dur="3.7s" repeatCount="indefinite" path="M300 232 L112 102"/></circle>
      <circle r="3.6" class="pulse"><animateMotion dur="4.2s" begin="-0.7s" repeatCount="indefinite" path="M300 232 L452 92"/></circle>
      <circle r="3.6" class="pulse"><animateMotion dur="4.8s" begin="-1.2s" repeatCount="indefinite" path="M300 232 L526 220"/></circle>
      <circle r="3.6" class="pulse"><animateMotion dur="5.0s" begin="-1.9s" repeatCount="indefinite" path="M300 232 L414 372"/></circle>
      <circle r="3.6" class="pulse"><animateMotion dur="4.6s" begin="-2.6s" repeatCount="indefinite" path="M300 232 L142 344"/></circle>
      <circle r="3.2" class="pulse"><animateMotion dur="5.1s" begin="-3.0s" repeatCount="indefinite" path="M112 102 L184 174"/></circle>
      <circle r="3.2" class="pulse"><animateMotion dur="3.9s" begin="-3.5s" repeatCount="indefinite" path="M452 92 L392 182"/></circle>
      <circle r="3.2" class="pulse"><animateMotion dur="4.9s" begin="-4.1s" repeatCount="indefinite" path="M526 220 L580 332"/></circle>
      <circle r="3.2" class="pulse"><animateMotion dur="4.0s" begin="-4.7s" repeatCount="indefinite" path="M142 344 L212 278"/></circle>
      <circle r="3.2" class="pulse"><animateMotion dur="5.2s" begin="-5.2s" repeatCount="indefinite" path="M348 56 L392 182"/></circle>
    </g>

    <circle cx="300" cy="232" r="31" fill="#7fd39a" opacity=".14" filter="url(#softGlow)"/>
    <g>
      <circle class="node core" cx="300" cy="232" r="12"/>
      <circle class="node" cx="112" cy="102" r="7"/>
      <circle class="node" cx="452" cy="92" r="8"/>
      <circle class="node" cx="526" cy="220" r="7"/>
      <circle class="node" cx="414" cy="372" r="8"/>
      <circle class="node" cx="142" cy="344" r="7"/>
      <circle class="node small" cx="70" cy="56" r="4"/>
      <circle class="node small" cx="212" cy="62" r="4"/>
      <circle class="node small" cx="348" cy="56" r="4"/>
      <circle class="node small" cx="560" cy="136" r="4"/>
      <circle class="node small" cx="580" cy="332" r="4"/>
      <circle class="node small" cx="278" cy="408" r="4"/>
      <circle class="node small" cx="58" cy="366" r="4"/>
      <circle class="node small" cx="64" cy="222" r="4"/>
      <circle class="node" cx="392" cy="182" r="5"/>
      <circle class="node" cx="212" cy="278" r="5"/>
      <circle class="node" cx="364" cy="310" r="5"/>
      <circle class="node" cx="184" cy="174" r="5"/>
    </g>

    <g>
      <text x="300" y="275" text-anchor="middle" class="core-text">KINETIC</text>
      <text x="112" y="80" text-anchor="middle" class="label">IDEAS</text>
      <text x="452" y="68" text-anchor="middle" class="label">CAPITAL</text>
      <text x="526" y="198" text-anchor="middle" class="label">PEOPLE</text>
      <text x="414" y="350" text-anchor="middle" class="label">VALUE</text>
      <text x="142" y="322" text-anchor="middle" class="label">INSIGHT</text>
    </g>

    <!-- Wind turbines integrated into the graphic -->
    <g transform="translate(548 145)">
      <ellipse class="turbine-glow" cx="24" cy="140" rx="72" ry="96"/>
      <rect class="turbine-tower" x="19" y="136" width="10" height="182" rx="5"/>
      <g class="rotor" style="animation:rotor 7s linear infinite; transform-origin:24px 132px;">
        <circle class="turbine-hub" cx="24" cy="132" r="6"/>
        <rect class="blade" x="21" y="48" width="6" height="84" rx="5"/>
        <rect class="blade" x="21" y="48" width="6" height="84" rx="5" transform="rotate(120 24 132)"/>
        <rect class="blade" x="21" y="48" width="6" height="84" rx="5" transform="rotate(240 24 132)"/>
      </g>
      <ellipse cx="24" cy="320" rx="78" ry="16" fill="#8de5a6" opacity=".16" filter="url(#softGlow)"/>
    </g>

    <g transform="translate(642 198) scale(.74)">
      <ellipse class="turbine-glow" cx="24" cy="140" rx="72" ry="96"/>
      <rect class="turbine-tower" x="19" y="136" width="10" height="182" rx="5"/>
      <g class="rotor" style="animation:rotor 6s linear infinite reverse; transform-origin:24px 132px;">
        <circle class="turbine-hub" cx="24" cy="132" r="6"/>
        <rect class="blade" x="21" y="48" width="6" height="84" rx="5"/>
        <rect class="blade" x="21" y="48" width="6" height="84" rx="5" transform="rotate(120 24 132)"/>
        <rect class="blade" x="21" y="48" width="6" height="84" rx="5" transform="rotate(240 24 132)"/>
      </g>
      <ellipse cx="24" cy="320" rx="78" ry="16" fill="#8de5a6" opacity=".16" filter="url(#softGlow)"/>
    </g>

    <g transform="translate(494 248) scale(.60)">
      <ellipse class="turbine-glow" cx="24" cy="140" rx="72" ry="96"/>
      <rect class="turbine-tower" x="19" y="136" width="10" height="182" rx="5"/>
      <g class="rotor" style="animation:rotor 8s linear infinite; transform-origin:24px 132px;">
        <circle class="turbine-hub" cx="24" cy="132" r="6"/>
        <rect class="blade" x="21" y="48" width="6" height="84" rx="5"/>
        <rect class="blade" x="21" y="48" width="6" height="84" rx="5" transform="rotate(120 24 132)"/>
        <rect class="blade" x="21" y="48" width="6" height="84" rx="5" transform="rotate(240 24 132)"/>
      </g>
      <ellipse cx="24" cy="320" rx="78" ry="16" fill="#8de5a6" opacity=".16" filter="url(#softGlow)"/>
    </g>

    <text x="380" y="478" text-anchor="middle" class="caption">IDEAS · PEOPLE · CAPITAL · VALUE</text>
  </g>
</svg>
